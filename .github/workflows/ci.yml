name: DOMA TECH CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/script.js
          node --check admin/admin.js
          node --check scripts/server-smoke-test.js
          node --check scripts/db-maintenance-test.js
          node --check scripts/order-notifier.js
          node --check scripts/order-notifier-test.js

      - name: Run server and database tests
        run: npm test
