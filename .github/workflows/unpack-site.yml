name: Unpack DOMA TECH site

# Запуск только вручную после проверки содержимого DOMA_TECH_server_v3.zip.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack site archive
        run: |
          test -f DOMA_TECH_server_v3.zip
          mkdir -p extracted
          unzip -q DOMA_TECH_server_v3.zip -d extracted
          test -d extracted/doma_tech_server
          cp -a extracted/doma_tech_server/. .
          rm -rf extracted DOMA_TECH_server_v3.zip

      - name: Commit unpacked site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -A
          git commit -m "Unpack DOMA TECH site files" || echo "No changes to commit"
          git push
