name: DOMA TECH tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check browser script syntax
        run: node --check public/script.js

      - name: Run server and database tests
        run: npm test

      - name: Install Chromium and run desktop/mobile browser QA
        run: npx --yes --package=playwright@1.55.0 -c 'playwright install --with-deps chromium && NODE_PATH="$(dirname "$(dirname "$(command -v playwright)")")" node scripts/browser-visual-qa.cjs'

      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doma-tech-browser-qa
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
