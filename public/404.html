<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#101317">
  <title>Страница не найдена — DOMA TECH</title>
  <link rel="icon" type="image/svg+xml" href="/doma-tech/favicon.svg">
  <link rel="stylesheet" href="/doma-tech/styles.css">
  <link rel="stylesheet" href="/doma-tech/rebirth.css">
  <style>
    .not-found{min-height:calc(100svh - 82px);display:grid;place-items:center;padding:64px 24px;background:radial-gradient(ellipse at 50% 35%,#35404a 0%,#202830 35%,#101317 78%);color:#f4f2ed;text-align:center}
    .not-found-inner{width:min(100%,680px)}
    .not-found-code{margin:0;color:#d7bc95;font:500 clamp(96px,22vw,190px)/.9 Georgia,serif;letter-spacing:-.08em}
    .not-found h1{margin:28px 0 14px;font:600 clamp(28px,5vw,44px)/1.1 Manrope,Arial,sans-serif;letter-spacing:-.04em}
    .not-found p{max-width:470px;margin:0 auto;color:#b8c1c8;font-size:14px;line-height:1.8}
    .not-found-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
    .not-found .button{min-height:48px}
    .not-found .button-secondary{border:1px solid #c6a47777;background:transparent;color:#ead8bb}
    .not-found-note{margin-top:44px!important;color:#85929a!important;font-size:10px!important;letter-spacing:.08em}
    @media(max-width:520px){.not-found{min-height:calc(100svh - 72px);padding:52px 20px}.not-found-actions{display:grid}.not-found-actions .button{width:100%}}
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="/doma-tech/" aria-label="DOMA TECH — главная">
      <span class="brand-mark">D</span>
      <span>DOMA <b>TECH</b><small>ТЕХНИКА ДЛЯ ДОМА</small></span>
    </a>
    <a class="header-cta" href="/doma-tech/#catalog">Перейти в каталог <span>↗</span></a>
  </header>
  <main class="not-found" id="main">
    <div class="not-found-inner">
      <p class="not-found-code" aria-hidden="true">404</p>
      <h1>Кажется, эта страница потерялась</h1>
      <p>Такого адреса нет или страница была перемещена. Вернитесь на главную и продолжите знакомство с DOMA TECH.</p>
      <div class="not-found-actions">
        <a class="button button-gold" href="/doma-tech/">На главную <span>→</span></a>
        <a class="button button-secondary" href="/doma-tech/#catalog">Открыть каталог</a>
      </div>
      <p class="not-found-note">DOMA TECH · ДЕМОНСТРАЦИОННЫЙ ПРОЕКТ</p>
    </div>
  </main>
</body>
</html>
